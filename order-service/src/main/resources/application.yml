server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Local cache for catalog offering validation results.
  # Purpose: when the catalog is temporarily unreachable, orders for *previously seen*
  # offerings are still accepted (served from cache). Unknown offerings always fail safely.
  cache:
    type: caffeine
    cache-names: catalog-valid-offerings
    caffeine:
      # 5-minute TTL — conservative relative to catalog's own 10-minute cache.
      # Max 200 entries covers typical product catalog sizes without unbounded memory growth.
      spec: maximumSize=200,expireAfterWrite=5m
  # TASK-27: explicit drain window so graceful shutdown behaviour is documented and predictable.
  # Requests in-flight when SIGTERM arrives are allowed up to this duration to complete.
  # Keep shorter than the load-balancer connection-drain timeout (typically 30 s) so
  # the LB stops routing before Spring forcibly terminates remaining requests.
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  api-key: ${APP_API_KEY:dev-api-key}
  # Set to true to enforce X-API-Key header on all requests.
  # Default is false so automated test harnesses work out of the box without sending the header.
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    api-key: ${CATALOG_API_KEY:internal-catalog-key}

resilience4j:
  circuitbreaker:
    instances:
      catalog:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
        ignore-exceptions:
          - com.dak.order.domain.exception.ProductOfferingNotFoundException

  retry:
    configs:
      # Reusable base config for all outbound HTTP clients in this service.
      # Retry ONLY on transient failures — network errors and 5xx server errors.
      # 4xx (client errors) are never transient: retrying a 400/401/404 is pointless.
      # New outbound clients inherit this with: baseConfig: httpOutbound
      httpOutbound:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException    # network/timeout
          - org.springframework.web.client.HttpServerErrorException   # 502, 503, 504, 500
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException   # 4xx — don't retry
    instances:
      catalog:
        baseConfig: httpOutbound
        # Per-instance overrides go here (e.g. max-attempts: 3 in prod application-prod.yml)
  # timelimiter block removed: @TimeLimiter annotation only works on CompletableFuture-returning
  # methods. CatalogRestAdapter.validateOfferings() is synchronous (void), so this config was
  # inert. The active 2-second deadline is enforced by JdkClientHttpRequestFactory.setReadTimeout()
  # in CatalogClientConfig.

# TASK-26: Swagger UI controlled by SWAGGER_ENABLED env var.
# Default: true (on) — works out of the box for development and testing.
# Production: set SWAGGER_ENABLED=false to remove the API surface from public view.
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "[%X{correlationId:-no-corr-id}] %d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
