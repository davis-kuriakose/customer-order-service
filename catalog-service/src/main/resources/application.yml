server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:catalog_db}
    username: ${DB_USERNAME:catalog_user}
    password: ${DB_PASSWORD:catalog_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  # TASK-27: explicit drain window — see order-service application.yml for full explanation.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # TASK-28: Caffeine-backed cache for product-offering lookups.
  # Offerings are read-only reference data; caching avoids a DB round-trip on every
  # order validation call from order-service. TTL of 10 minutes keeps data reasonably
  # fresh without manual cache invalidation.
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

app:
  api-key: ${APP_API_KEY:internal-catalog-key}
  security:
    enabled: ${APP_SECURITY_ENABLED:false}

# TASK-26: see order-service application.yml for explanation.
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "[%X{correlationId:-no-corr-id}] %d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
