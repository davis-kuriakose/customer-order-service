services:

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
    ports:
      - "5432:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass}
    ports:
      - "5433:5433"
    command: -p 5433
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U catalog_user -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: catalog-db
      DB_PORT: 5433
      DB_NAME: catalog_db
      DB_USERNAME: catalog_user
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass}
      APP_API_KEY: ${CATALOG_API_KEY:-internal-catalog-key}
    depends_on:
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: order_user
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
      APP_API_KEY: ${APP_API_KEY:-dev-api-key}
      CATALOG_SERVICE_URL: http://catalog-service:8081
      CATALOG_API_KEY: ${CATALOG_API_KEY:-internal-catalog-key}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    depends_on:
      order-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

volumes:
  order-db-data:
  catalog-db-data:
